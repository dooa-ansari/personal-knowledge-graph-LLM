[project]
name = "fast-api-migration"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "uvicorn>=0.52.4",
    "rdflib>=7.1.1",
    "chromadb>=0.6.3",
    "openai>=2.45.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
]

[tool.uv]
override-dependencies = [
    "onnxruntime>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]
