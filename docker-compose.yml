services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - chroma_data:/app/chroma
    depends_on:
      - redis
    restart: unless-stopped

  # TLS reverse proxy. Disabled by default; enable with COMPOSE_PROFILES=tls
  # (see .env / GitHub repo variables) once API_HOSTNAME has a DNS A record
  # pointing at this server. Caddy auto-provisions Let's Encrypt certs.
  # When TLS goes live: remove the api "ports" mapping above so only 80/443
  # are exposed, and set SESSION_COOKIE_SECURE=true.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: caddy reverse-proxy --from "${API_HOSTNAME}" --to api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  chroma_data:
  caddy_data:
  caddy_config:
